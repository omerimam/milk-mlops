services:
  milk-api:
    image: milk-forecast-api:1.0
    container_name: milk-api-container

    ports:
      - "8001:8000"

    environment:
      MODEL_URI: /app/models/champion_model

    restart: unless-stopped


  milk-monitoring:
    build:
      context: .
      dockerfile: Dockerfile.monitoring

    image: milk-evidently:1.0

    volumes:
      - ./monitoring-data:/app/monitoring-data:ro
      - ./reports:/app/reports

    restart: "no"

    profiles:
      - monitoring


  milk-monitoring-web:
    image: nginx:alpine
    container_name: milk-monitoring-web

    ports:
      - "8082:80"

    volumes:
      - ./reports:/usr/share/nginx/html:ro

    restart: unless-stopped