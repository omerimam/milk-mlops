name: Milk MLOps CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install serving dependencies
        run: pip install -r requirements-serving.txt

      - name: Test FastAPI import
        run: python -c "from app.main import app; print('FastAPI import successful')"

      - name: Build Docker image
        run: docker build -t milk-forecast-api:ci .