name: Milk MLOps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install serving dependencies
        run: pip install -r requirements-serving.txt

      - name: Test FastAPI import
        run: python -c "from app.main import app; print('FastAPI import successful')"

      - name: Build Docker image
        run: docker build -t milk-forecast-api:ci .

  publish-image:
    needs: build-and-test
    runs-on: ubuntu-latest

    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/omerimam/milk-forecast-api:latest
            ghcr.io/omerimam/milk-forecast-api:${{ github.sha }}